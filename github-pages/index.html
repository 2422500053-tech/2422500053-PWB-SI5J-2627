<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Preview statis website Pemrograman Web Bisnis.">
  <title>Website Kami | Pemrograman Web Bisnis</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #172b3a;
      background: #f4f7f4;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid #d7e2dc;
      border-top: 6px solid #28705b;
      background: #fff;
      box-shadow: 0 18px 50px rgb(23 43 58 / 8%);
    }

    p { line-height: 1.65; }

    .eyebrow {
      margin: 0 0 16px;
      color: #28705b;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1.08;
    }

    .notice {
      margin: 28px 0 0;
      padding: 16px 18px;
      border-left: 3px solid #d18a36;
      background: #fbf6ed;
      color: #594629;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Pemrograman Web Bisnis</p>
    <h1>Selamat datang di website kami</h1>
    <p class="notice">Ini adalah preview statis untuk GitHub Pages. Fitur aplikasi yang membutuhkan PHP dan database MySQL tidak tersedia di GitHub Pages.</p>
  </main>
</body>
</html>
